name: random_recall
description: A random recall quiz notification app.
version: 1.4.3+10
publish_to: 'none'

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0

  # State management
  provider: ^6.1.2

  # Utilities
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  intl: ^0.19.0
  app_settings: ^5.1.1
  workmanager: ^0.9.0
  device_info_plus: ^11.0.0
  android_intent_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
