name: random_recall
description: A random recall quiz notification app.
version: 0.9.0+16
publish_to: 'none'

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Auth
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_app_check: ^0.3.1
  google_sign_in: ^6.2.1
  cloud_firestore: ^5.0.2
  firebase_performance: ^0.10.0
  firebase_remote_config: ^5.1.0
  firebase_crashlytics: ^4.1.0

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Image handling & storage
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  image: ^4.0.0
  path_provider: ^2.1.0
  firebase_storage: ^12.4.10

  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^5.0.0

  # State management
  provider: ^6.1.2

  # Utilities
  shared_preferences: ^2.3.2
  uuid: ^4.4.2
  intl: ^0.20.2
  app_settings: ^5.1.1
  workmanager: ^0.9.0
  device_info_plus: ^11.0.0
  android_intent_plus: ^5.0.0
  purchases_flutter: ^9.16.1
  http: ^1.1.0

  # Crash reporting & analytics
  sentry_flutter: ^8.10.1
  posthog_flutter: ^4.6.1

  # Localizations
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6A1B9A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
