name: random_recall
description: A random recall quiz notification app.
version: 0.13.21+52
publish_to: 'none'

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Auth
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  firebase_app_check: ^0.4.6
  google_sign_in: ^7.2.0
  intl_phone_field: ^3.2.0
  cloud_firestore: ^6.8.0
  firebase_performance: ^0.11.4
  firebase_remote_config: ^6.5.6
  firebase_crashlytics: ^5.2.7
  firebase_analytics: ^12.4.6

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Image handling & storage
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  image: ^4.0.0
  path_provider: ^2.1.0
  firebase_storage: ^13.4.6

  # Notifications
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  flutter_timezone: ^5.0.0

  # State management
  provider: ^6.1.2

  # Utilities
  shared_preferences: ^2.3.2
  uuid: ^4.6.0
  intl: ^0.20.2
  app_settings: ^7.0.0
  workmanager: ^0.10.7
  device_info_plus: ^13.2.0
  android_intent_plus: ^6.1.0
  purchases_flutter: ^10.7.0

  # Ads
  google_mobile_ads: ^9.0.0


  # Localizations
  flutter_localizations:
    sdk: flutter
  flutter_jailbreak_detection: ^1.10.0
  showcaseview: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  # Test-only: fake Firebase platforms for unit tests that touch Firebase singletons
  firebase_core_platform_interface: ^8.1.0
  firebase_auth_platform_interface: ^9.0.6
  sqflite_common_ffi: ^2.3.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#6A1B9A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
