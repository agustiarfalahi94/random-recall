name: Flutter Build & Test

on:
  push:
    branches: [develop, main, feature/**]
  pull_request:
    branches: [develop, main]

jobs:
  # ──────────────────────────────────────────────────────────────────
  # ANALYSIS & TESTING - Runs on every commit
  # ──────────────────────────────────────────────────────────────────
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n files
        run: flutter gen-l10n

      - name: Run Dart analyzer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib/

  # ──────────────────────────────────────────────────────────────────
  # UNIT & WIDGET TESTS
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n files
        run: flutter gen-l10n

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # BUILD APK - Ready for manual testing & Play Store deployment
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    needs: [analyze, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Go to repo Settings > Secrets > Actions and add it."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          # Validate the decoded file is valid JSON
          python3 -c "import json; json.load(open('android/app/google-services.json'))" || {
            echo "::error::google-services.json decoded but is not valid JSON. Re-encode with: base64 -w 0 android/app/google-services.json"
            exit 1
          }
          echo "✅ google-services.json decoded and validated"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n files
        run: flutter gen-l10n

      - name: Build APK (debug)
        run: flutter build apk --debug

      # ────────────────────────────────────────────────────────────
      # STORE BUILD ARTIFACTS - For manual testing
      # ────────────────────────────────────────────────────────────
      - name: Upload APK (debug) as artifact
        uses: actions/upload-artifact@v4
        with:
          name: random-recall-debug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      # ────────────────────────────────────────────────────────────
      # FUTURE: Release build & Play Store deployment
      # ────────────────────────────────────────────────────────────
      # When you're ready to launch (have signing keystore + Play Store account):
      #
      # 1. Uncomment "Build App Bundle (release)" step above
      # 2. Create key.properties with signing config (see android/app/build.gradle.kts)
      # 3. Add as GitHub secret: KEYSTORE_PROPERTIES
      # 4. Decode it in the build job (like google-services.json)
      # 5. Create Play Store service account
      # 6. Add as GitHub secret: PLAY_STORE_CREDENTIALS
      # 7. Uncomment the deployment steps below
      #
      # Deployment steps:
      # - name: Build App Bundle (release)
      #   run: flutter build appbundle --release
      #
      # - name: Upload to Play Store (Internal Testing)
      #   if: github.ref == 'refs/heads/develop'
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJson: ${{ secrets.PLAY_STORE_CREDENTIALS }}
      #     packageName: com.inkpebble.randomrecall
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: internal
      #     status: completed
      #
      # - name: Upload to Play Store (Production)
      #   if: github.ref == 'refs/heads/main'
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJson: ${{ secrets.PLAY_STORE_CREDENTIALS }}
      #     packageName: com.inkpebble.randomrecall
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: production
      #     status: completed

  # ──────────────────────────────────────────────────────────────────
  # CREATE RELEASE - On version tags (v*.*.*)
  # ──────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [analyze, test, build]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: random-recall-debug.apk
          path: ./

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" \
            --title "Random Recall $TAG_NAME" \
            --generate-notes \
            app-debug.apk
