name: Flutter Build & Test

on:
  push:
    tags: [v*]
  pull_request:
    branches: [develop, main]

jobs:
  # ──────────────────────────────────────────────────────────────────
  # ANALYSIS & TESTING - Runs on every commit
  # ──────────────────────────────────────────────────────────────────
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n files
        run: flutter gen-l10n

      - name: Run Dart analyzer
        run: flutter analyze

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed lib/

  # ──────────────────────────────────────────────────────────────────
  # UNIT & WIDGET TESTS
  # ──────────────────────────────────────────────────────────────────
  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n files
        run: flutter gen-l10n

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
        continue-on-error: true

  # ──────────────────────────────────────────────────────────────────
  # BUILD APK - Ready for manual testing & Play Store deployment
  # ──────────────────────────────────────────────────────────────────
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    needs: [analyze, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Go to repo Settings > Secrets > Actions and add it."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          # Validate the decoded file is valid JSON
          python3 -c "import json; json.load(open('android/app/google-services.json'))" || {
            echo "::error::google-services.json decoded but is not valid JSON. Re-encode with: base64 -w 0 android/app/google-services.json"
            exit 1
          }
          echo "✅ google-services.json decoded and validated"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n files
        run: flutter gen-l10n

      # ────────────────────────────────────────────────────────────
      # COMPILE CHECK ONLY — this APK is never uploaded or published.
      # It exists to catch Android/Gradle build breakage that `analyze`
      # and `test` can't see. Debug APKs are built LOCALLY for device
      # testing; GitHub only ever distributes the release build below.
      #
      # Because nothing is distributed from this step, the signing key
      # is irrelevant — the runner's auto-generated debug key is fine.
      # (CI used to publish this APK signed with a per-run random key,
      # which broke Google Sign-In for downloaders and forced an
      # uninstall before every install. Solved by not shipping it.)
      # ────────────────────────────────────────────────────────────
      - name: Build APK (debug — compile check, not published)
        run: flutter build apk --debug

      # ────────────────────────────────────────────────────────────
      # RELEASE APK (GitHub distribution) — signed with the release
      # keystore so Google Sign-In works for everyone who downloads it.
      # The release SHA-1 (D3:A4:...) is registered in Firebase Console.
      # Secrets (set once):
      #   base64 -i android/app/release-keystore.jks | gh secret set KEYSTORE_BASE64
      #   gh secret set KEYSTORE_PROPERTIES < android/key.properties
      #
      # Tag builds only. A release-signed APK is only ever published from a
      # v* tag (the `release` job below), so PR/branch builds must not need
      # the signing secrets — they just produce the debug APK above.
      # ────────────────────────────────────────────────────────────
      - name: Install release signing keys
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_PROPERTIES" ] || [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_PROPERTIES / KEYSTORE_BASE64 secrets are not set. See CI_CD_SETUP.md — the GitHub Release APK needs the release signing key (a debug-signed 'release' APK silently breaks Google login for downloaders)."
            exit 1
          fi
          echo "$KEYSTORE_PROPERTIES" > android/key.properties
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          if [ ! -s android/app/release-keystore.jks ]; then
            echo "::error::KEYSTORE_BASE64 did not decode to a keystore file. Re-encode with: base64 -i android/app/release-keystore.jks"
            exit 1
          fi
          echo "✅ release signing keys installed"

      - name: Build APK (release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --dart-define=REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}

      - name: Upload APK (release) as artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: random-recall-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90
          if-no-files-found: error

      # ────────────────────────────────────────────────────────────
      # FUTURE: Release build & Play Store deployment
      # ────────────────────────────────────────────────────────────
      # When you're ready to launch (have signing keystore + Play Store account):
      #
      # 1. Uncomment "Build App Bundle (release)" step above
      # 2. Create key.properties with signing config (see android/app/build.gradle.kts)
      # 3. Add as GitHub secret: KEYSTORE_PROPERTIES
      # 4. Decode it in the build job (like google-services.json)
      # 5. Create Play Store service account
      # 6. Add as GitHub secret: PLAY_STORE_CREDENTIALS
      # 7. Uncomment the deployment steps below
      #
      # Deployment steps:
      # - name: Build App Bundle (release, obfuscated)
      #   run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info --dart-define=REVENUECAT_API_KEY=${{ secrets.REVENUECAT_API_KEY }}
      #
      # - name: Upload to Play Store (Internal Testing)
      #   if: github.ref == 'refs/heads/develop'
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJson: ${{ secrets.PLAY_STORE_CREDENTIALS }}
      #     packageName: com.inkpebble.randomrecall
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: internal
      #     status: completed
      #
      # - name: Upload to Play Store (Production)
      #   if: github.ref == 'refs/heads/main'
      #   uses: r0adkll/upload-google-play@v1
      #   with:
      #     serviceAccountJson: ${{ secrets.PLAY_STORE_CREDENTIALS }}
      #     packageName: com.inkpebble.randomrecall
      #     releaseFiles: build/app/outputs/bundle/release/app-release.aab
      #     track: production
      #     status: completed

  # ──────────────────────────────────────────────────────────────────
  # CREATE RELEASE - On version tags (v*.*.*)
  # ──────────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [analyze, test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release APK artifact
        uses: actions/download-artifact@v4
        with:
          name: random-recall-release.apk
          path: ./

      # Only the release-signed APK is published. Debug builds are made
      # locally for device testing — see CLAUDE.md.
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          gh release create "$TAG_NAME" \
            --title "Random Recall $TAG_NAME" \
            --generate-notes \
            "app-release.apk#RandomRecall-$TAG_NAME.apk"
